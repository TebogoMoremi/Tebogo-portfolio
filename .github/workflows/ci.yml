name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: tebogo-portfolio
  S3_BUCKET: tebogo-moremi-portfolio-2026
  CLOUDFRONT_DISTRIBUTION_ID: E1RM5JSS43QQ59

jobs:
  build-and-deploy:
    name: Build and Deploy Portfolio
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # Build React / Vite application
      # ----------------------------------------
      - name: Build React application
        run: npm run build

      # ----------------------------------------
      # AWS authentication using GitHub OIDC
      # Only required for pushes to main
      # ----------------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263953131930:role/GitHubActionsTebogoPortfolioRole
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # Docker validation for Pull Requests
      # ----------------------------------------
      - name: Build Docker image
        if: github.event_name == 'pull_request'
        run: docker build -t tebogo-portfolio:test .

      # ----------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # Build and push Docker image to ECR
      # Keeps Docker/ECR in the DevOps pipeline
      # without running ECS/Fargate continuously
      # ----------------------------------------
      - name: Build and push Docker image to ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # ----------------------------------------
      # Deploy Vite production build to S3
      # ----------------------------------------
      - name: Deploy portfolio to S3
        if: github.event_name == 'push'
        run: |
          aws s3 sync dist/ s3://$S3_BUCKET --delete

      # ----------------------------------------
      # Invalidate CloudFront cache
      # ----------------------------------------
      - name: Invalidate CloudFront cache
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      # ----------------------------------------
      # Deployment summary
      # ----------------------------------------
      - name: Deployment summary
        if: github.event_name == 'push'
        run: |
          echo "=========================================="
          echo "Portfolio deployment completed!"
          echo "=========================================="
          echo "Production hosting: S3 + CloudFront"
          echo "S3 Bucket: $S3_BUCKET"
          echo "CloudFront Distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          echo "Docker image pushed to Amazon ECR"
          echo "ECS/Fargate production deployment: Disabled"
          echo "=========================================="